<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <title>Editor SCADA</title>
</head>
<body class="h-screen flex flex-col bg-slate-50 text-slate-800 font-sans overflow-hidden">

    <header class="h-14 bg-white border-b border-slate-200 flex items-center justify-between px-4 shadow-sm z-10">
        <div class="flex items-center gap-4">
            <div class="font-bold text-lg tracking-tight">SCADA <span class="text-blue-600">Designer</span></div>
            <div class="h-6 w-px bg-slate-300"></div>
            <div class="flex bg-slate-100 p-1 rounded-lg">
                <button class="px-3 py-1 text-xs font-bold bg-white text-blue-600 rounded shadow-sm border border-slate-200">
                    <i class="ph-bold ph-pencil-simple"></i> EDICIÓN
                </button>
                <button class="px-3 py-1 text-xs font-bold text-slate-500 hover:text-slate-700">
                    <i class="ph-bold ph-play"></i> RUNTIME
                </button>
            </div>
        </div>

        <div class="flex gap-1 bg-slate-100 p-1 rounded-md">
            <button class="p-2 rounded hover:bg-white hover:shadow-sm text-slate-700" title="Seleccionar"><i class="ph-bold ph-cursor"></i></button>
            <button class="p-2 rounded hover:bg-white hover:shadow-sm text-slate-700" title="Mover Lienzo"><i class="ph-bold ph-hand-grabbing"></i></button>
            <div class="w-px h-6 bg-slate-300 mx-1 self-center"></div>
            <button class="p-2 rounded hover:bg-white hover:shadow-sm text-slate-700" title="Deshacer"><i class="ph-bold ph-arrow-u-up-left"></i></button>
            <button class="p-2 rounded hover:bg-white hover:shadow-sm text-slate-700" title="Rehacer"><i class="ph-bold ph-arrow-u-up-right"></i></button>
        </div>

        <div class="flex gap-2">
            <button class="px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 text-sm font-semibold rounded">Cancelar</button>
            <button class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold rounded shadow flex items-center gap-2">
                <i class="ph-bold ph-floppy-disk"></i> Guardar Diagrama
            </button>
        </div>
    </header>

    <main class="flex-1 flex overflow-hidden">
        
        <aside class="w-64 bg-white border-r border-slate-200 flex flex-col shadow-sm z-10">
            <div class="p-3 bg-slate-50 border-b border-slate-200 font-semibold text-xs uppercase text-slate-500">Componentes</div>
            
            <div class="flex-1 overflow-y-auto p-2 space-y-4">
                
                <div>
                    <h3 class="text-xs font-bold text-slate-800 mb-2 pl-1">Sensores & Input</h3>
                    <div class="grid grid-cols-2 gap-2">
                        <div class="flex flex-col items-center justify-center p-3 border border-slate-200 rounded hover:border-blue-400 hover:bg-blue-50 cursor-grab active:cursor-grabbing transition bg-white" draggable="true">
                            <i class="ph-duotone ph-scales text-2xl text-blue-500 mb-1"></i>
                            <span class="text-[10px] font-medium text-slate-600">Báscula</span>
                        </div>
                        <div class="flex flex-col items-center justify-center p-3 border border-slate-200 rounded hover:border-blue-400 hover:bg-blue-50 cursor-grab active:cursor-grabbing transition bg-white" draggable="true">
                            <i class="ph-duotone ph-eye text-2xl text-purple-500 mb-1"></i>
                            <span class="text-[10px] font-medium text-slate-600">Sensor IR</span>
                        </div>
                        <div class="flex flex-col items-center justify-center p-3 border border-slate-200 rounded hover:border-blue-400 hover:bg-blue-50 cursor-grab active:cursor-grabbing transition bg-white" draggable="true">
                            <i class="ph-duotone ph-video-camera text-2xl text-slate-500 mb-1"></i>
                            <span class="text-[10px] font-medium text-slate-600">Cámara LPR</span>
                        </div>
                    </div>
                </div>

                <div>
                    <h3 class="text-xs font-bold text-slate-800 mb-2 pl-1">Señales & Salidas</h3>
                    <div class="grid grid-cols-2 gap-2">
                        <div class="flex flex-col items-center justify-center p-3 border border-slate-200 rounded hover:border-blue-400 hover:bg-blue-50 cursor-grab active:cursor-grabbing transition bg-white" draggable="true">
                            <i class="ph-duotone ph-traffic-signal text-2xl text-yellow-500 mb-1"></i>
                            <span class="text-[10px] font-medium text-slate-600">Semáforo</span>
                        </div>
                        <div class="flex flex-col items-center justify-center p-3 border border-slate-200 rounded hover:border-blue-400 hover:bg-blue-50 cursor-grab active:cursor-grabbing transition bg-white" draggable="true">
                            <i class="ph-duotone ph-text-t text-2xl text-slate-700 mb-1"></i>
                            <span class="text-[10px] font-medium text-slate-600">Etiqueta LED</span>
                        </div>
                    </div>
                </div>

            </div>
        </aside>

        <section class="flex-1 bg-slate-100 relative overflow-hidden flex items-center justify-center">
            
            <div class="absolute inset-0 opacity-20" style="background-image: radial-gradient(#64748b 1px, transparent 1px); background-size: 20px 20px;"></div>
            
            <div class="relative w-[600px] h-[400px] border-2 border-dashed border-slate-300 rounded flex items-center justify-center">
                <span class="text-slate-400 text-sm">Área de Trabajo (React Flow)</span>
                
                <div class="absolute top-20 left-20 w-32 bg-white border-2 border-blue-500 shadow-lg rounded p-2 flex flex-col items-center z-20">
                    <div class="w-3 h-3 rounded-full bg-blue-500 absolute -top-1.5 cursor-crosshair"></div>
                    <i class="ph-duotone ph-scales text-2xl text-blue-600"></i>
                    <span class="text-xs font-bold mt-1">Báscula #1</span>
                    <div class="w-3 h-3 rounded-full bg-blue-500 absolute -bottom-1.5 cursor-crosshair"></div>
                </div>
            </div>

            <div class="absolute bottom-4 left-4 bg-white shadow-md rounded flex flex-col border border-slate-200">
                <button class="p-2 hover:bg-slate-50 text-slate-600 border-b border-slate-100"><i class="ph-bold ph-plus"></i></button>
                <button class="p-2 hover:bg-slate-50 text-slate-600 border-b border-slate-100"><i class="ph-bold ph-minus"></i></button>
                <button class="p-2 hover:bg-slate-50 text-slate-600"><i class="ph-bold ph-corners-out"></i></button>
            </div>

        </section>

        <aside class="w-72 bg-white border-l border-slate-200 flex flex-col shadow-sm z-10">
            <div class="p-3 bg-slate-50 border-b border-slate-200 font-semibold text-xs uppercase text-slate-500">Propiedades</div>
            
            <div class="flex-1 overflow-y-auto p-4 space-y-6">
                
                <div class="flex items-center gap-3 mb-2">
                    <div class="p-2 bg-blue-100 rounded text-blue-600"><i class="ph-duotone ph-scales text-xl"></i></div>
                    <div>
                        <div class="text-sm font-bold text-slate-800">Báscula #1</div>
                        <div class="text-[10px] text-slate-400 font-mono">ID: node_8472</div>
                    </div>
                </div>

                <div class="space-y-3">
                    <label class="block">
                        <span class="text-xs font-semibold text-slate-600">Etiqueta Visual</span>
                        <input type="text" value="Báscula Entrada" class="mt-1 block w-full rounded border-slate-300 bg-slate-50 border px-2 py-1 text-sm focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none">
                    </label>
                </div>

                <hr class="border-slate-100">

                <div class="space-y-3">
                    <h4 class="text-xs font-bold text-blue-600 uppercase tracking-wider flex items-center gap-1">
                        <i class="ph-bold ph-lightning"></i> Conexión PLC
                    </h4>
                    
                    <label class="block">
                        <span class="text-xs font-semibold text-slate-600">Variable de Peso (Tag)</span>
                        <select class="mt-1 block w-full rounded border-slate-300 bg-white border px-2 py-1 text-sm text-slate-700">
                            <option>PLC1.Analog.Weight_In</option>
                            <option>PLC1.Analog.Weight_Out</option>
                            <option>Sin Asignar</option>
                        </select>
                    </label>

                    <label class="block">
                        <span class="text-xs font-semibold text-slate-600">Variable de Estado</span>
                        <select class="mt-1 block w-full rounded border-slate-300 bg-white border px-2 py-1 text-sm text-slate-700">
                            <option>PLC1.Status.Scale_Ready</option>
                            <option>PLC1.Status.Scale_Error</option>
                        </select>
                    </label>
                </div>

                <hr class="border-slate-100">

                <div class="space-y-3">
                    <h4 class="text-xs font-bold text-red-600 uppercase tracking-wider flex items-center gap-1">
                        <i class="ph-bold ph-warning"></i> Límites
                    </h4>
                    <div class="flex gap-2">
                        <label class="block w-1/2">
                            <span class="text-[10px] font-semibold text-slate-500">Max (kg)</span>
                            <input type="number" value="45000" class="mt-1 block w-full rounded border-slate-300 px-2 py-1 text-sm">
                        </label>
                        <label class="block w-1/2">
                            <span class="text-[10px] font-semibold text-slate-500">Min (kg)</span>
                            <input type="number" value="0" class="mt-1 block w-full rounded border-slate-300 px-2 py-1 text-sm">
                        </label>
                    </div>
                </div>

            </div>
            
            <div class="p-4 border-t border-slate-200">
                <button class="w-full py-2 border border-red-200 text-red-600 rounded hover:bg-red-50 text-xs font-bold transition">
                    Eliminar Componente
                </button>
            </div>
        </aside>

    </main>
</body>
</html>
